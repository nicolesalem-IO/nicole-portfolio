[build]
  command = "python3 build/build.py"
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/projects/understanding-adherence-concussion-tracking/*"
  to = "/projects/concussion-tracking-thesis/"
  status = 301

